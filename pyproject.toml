[tool.poetry]
name = "friseurbot"
version = "0.1.0"
description = "Friseurbot: A full appointment and salon management system"
authors = ["Faridkosarifard <140160767+Faridkosarifard@users.noreply.github.com>"]
readme = "README.md"
packages = [
    { include = "friseurbot", from = "."}
]


[tool.poetry.dependencies]
python = ">=3.12,<4.0"
bcrypt = "^4.3.0"
blinker = "^1.9.0"
cachetools = "^5.5.2"
certifi = "^2025.1.31"
charset-normalizer = "^3.4.1"
click = "^8.1.8"
colorama = "^0.4.6"
flask = "^3.1.0"
flask-cors = "^5.0.1"
google-api-core = "^2.24.2"
google-api-python-client = "^2.166.0"
google-auth = "^2.38.0"
google-auth-httplib2 = "^0.2.0"
google-auth-oauthlib = "^1.2.1"
googleapis-common-protos = "^1.69.2"
greenlet = "^3.1.1"
httplib2 = "^0.22.0"
idna = "^3.10"
itsdangerous = "^2.2.0"
jinja2 = "^3.1.6"
markupsafe = "^3.0.2"
oauthlib = "^3.2.2"
proto-plus = "^1.26.1"
protobuf = "^6.30.2"
psycopg2 = "^2.9.10"
pyasn1 = "^0.6.1"
pyasn1-modules = "^0.4.2"
pyparsing = "^3.2.3"
python-dateutil = "^2.9.0.post0"
pytz = "^2025.2"
requests = "^2.32.3"
requests-oauthlib = "^2.0.0"
rsa = "^4.9"
six = "^1.17.0"
sqlalchemy = "^2.0.40"
typing-extensions = "^4.13.2"
uritemplate = "^4.1.1"
urllib3 = "^2.3.0"
werkzeug = "^3.1.3"
typer = "^0.15.3"
psycopg2-binary = "^2.9.10"
make = "^0.1.6.post2"
python-dotenv = "^1.1.1"
pyjwt = "^2.10.1"
gunicorn = "^23.0.0"
holidays = "^0.79"

[tool.poetry.scripts]
friseurbot-cli = "friseurbot.cli:app"

[tool.poetry.group.dev.dependencies]
alembic = "^1.16.3"
black = "^25.1.0"
isort = "^6.0.1"
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
psutil = "^7.0.0"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | venv
  | env
  | credentials
  | alembic/versions
  | bot/dist
  | admin-panel/(node_modules|dist)
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["api", "entity", "utils", "friseur_admin"]
skip = [
    ".venv",
    "venv",
    "env",
    "credentials",
    "node_modules",
    "bot/dist",
    "admin-panel/node_modules",
    "admin-panel/dist",
    "alembic/versions"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"