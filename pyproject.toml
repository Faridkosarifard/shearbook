[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shearbook"
version = "0.1.0"
description = "Open-source appointment system for small salons, with a WhatsApp booking flow and optional Google Calendar sync."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Farid Kosarifard" },
]
keywords = ["salon", "appointments", "whatsapp", "calendar", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Flask",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "flask>=3.1",
  "flask-cors>=5.0",
  "sqlalchemy>=2.0",
  "bcrypt>=4.2",
  "pyjwt>=2.10",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "gunicorn>=23.0",
  "holidays>=0.60",
  "python-dateutil>=2.9",
  "google-api-python-client>=2.160",
  "google-auth>=2.38",
  "google-auth-oauthlib>=1.2",
  "requests>=2.32",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-python-dateutil>=2.9",
  "types-requests>=2.32",
]

[project.scripts]
shearbook = "shearbook.cli:app"

[project.urls]
Homepage = "https://github.com/Faridkosarifard/shearbook"
Issues = "https://github.com/Faridkosarifard/shearbook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shearbook"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shearbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["shearbook"]
branch = true
omit = ["src/shearbook/cli.py", "src/shearbook/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["shearbook"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
